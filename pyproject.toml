[project]
name = "rs-toolkit"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = ["numpy", "rasterio", "matplotlib"]
[project.optional-dependencies]
dev = ["pytest"]
[project.scripts]
rs-tool = "rs_toolkit.cli:main"
[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
where = ["src"]
